<!DOCTYPE html>
<html lang="en" data-shell="phone" data-platform="android" data-form-factor="phone" data-input="touch pen keyboard">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />

    <script>
        // First paint only (Foundation HANDOFF §2): the same rule as AndroidPlatformInfo — tablet when
        // the window's shorter side is at least 600 dp (CSS px are dp here). Runs once; MainLayout then
        // keeps the attributes in sync from IPlatformInfo (FormFactorChanged).
        (function () {
            var w = window.innerWidth || screen.width, h = window.innerHeight || screen.height;
            var ff = Math.min(w, h) >= 600 ? 'tablet' : 'phone';
            var root = document.documentElement;
            root.setAttribute('data-shell', ff);
            root.setAttribute('data-form-factor', ff);
        })();
    </script>

    <style>
        /* First-paint background so there's no white flash before the app styles load.
           Same values as the Windows host. */
        html, body { margin: 0; background: #F2EAD6; }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #100b08; }
        html[data-theme="palm"], html[data-theme="palm"] body { background: #ebe5c9; }
        html[data-theme="indigo"], html[data-theme="indigo"] body { background: #edf0f6; }
        html[data-theme="contrast"], html[data-theme="contrast"] body { background: #f5f5f2; }
    </style>

    <link rel="preload" href="_content/ChuvadiReader.Ui/lipi-sans/fonts/LiPi-Sans-Latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/fonts/google/fonts.css" />

    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/lipi-sans/lipi-sans.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/tokens.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/app.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/shell.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/mobile.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/prefs.css" />
    <link rel="stylesheet" href="ChuvadiReader.Android.styles.css" />
</head>
<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An error occurred. <a href="" class="reload">Reload</a>
    </div>

    <script src="_content/ChuvadiReader.Ui/js/theme.js"></script>
    <!-- MAUI starts Blazor itself once the WebView is ready; autostart would start it twice. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
