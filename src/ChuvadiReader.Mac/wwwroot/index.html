<!DOCTYPE html>
<html lang="en" data-shell="desktop" data-platform="macos" data-form-factor="desktop" data-input="mouse keyboard">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />

    <style>
        /* First-paint background so there's no white flash before the app styles load.
           Matches the window (light parchment); dark theme overrides once applied. */
        html, body { margin: 0; background: #F2EAD6; }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #100b08; }
        html[data-theme="palm"], html[data-theme="palm"] body { background: #ebe5c9; }
        html[data-theme="indigo"], html[data-theme="indigo"] body { background: #edf0f6; }
        html[data-theme="contrast"], html[data-theme="contrast"] body { background: #f5f5f2; }
    </style>

    <link rel="preload" href="_content/ChuvadiReader.Ui/lipi-sans/fonts/LiPi-Sans-Latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/fonts/google/fonts.css" />

    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/lipi-sans/lipi-sans.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/tokens.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/app.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/shell.css" />
    <link rel="stylesheet" href="_content/ChuvadiReader.Ui/css/prefs.css" />
    <link rel="stylesheet" href="ChuvadiReader.Mac.styles.css" />
</head>
<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An error occurred. <a href="" class="reload">Reload</a>
    </div>

    <script src="_content/ChuvadiReader.Ui/js/theme.js"></script>
    <script>
        // Startup timing marks (Mac Test M-06), read back only by the CI smoke run: when the page's
        // scripts start, and when Blazor puts the Ui's first content into #app.
        performance.mark('chvd-blazor-script');
        new MutationObserver(function (_, o) {
            if (document.getElementById('app').firstElementChild) { performance.mark('chvd-app-content'); o.disconnect(); }
        }).observe(document.getElementById('app'), { childList: true });
    </script>
    <script>
        // Mac Test M-19: page errors reach the Mac error log (D-132). Blazor reports a component's exception
        // with console.error(message + "\n" + .NET stack) and nothing else; forward that, window errors and
        // unhandled rejections to the host (Platform/PageErrorBridge.cs). Never sent anywhere else.
        (function () {
            var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.chvdLog;
            if (!h) { return; }
            var send = function (text) { try { h.postMessage(String(text).slice(0, 20000)); } catch (e) { } };
            var original = console.error;
            console.error = function () {
                try { send(Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : String(a); }).join(" ")); } catch (e) { }
                return original.apply(console, arguments);
            };
            window.addEventListener("error", function (e) { send("window error: " + e.message + "\n" + (e.error && e.error.stack || "")); });
            window.addEventListener("unhandledrejection", function (e) {
                var r = e.reason; send("unhandled rejection: " + (r && r.message || r) + "\n" + (r && r.stack || ""));
            });
        })();
    </script>
    <script>
        // Mac Test M-21: tell the Mac host when Immersive is on (reader.js sets body.chvd-immersive), so Esc can
        // leave it even when the page does not have the keyboard (Platform/MacImmersive.cs).
        (function () {
            var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.chvdState;
            if (!h) { return; }
            var last = null;
            var report = function () {
                var on = document.body && document.body.classList.contains('chvd-immersive') ? 1 : 0;
                if (on !== last) { last = on; try { h.postMessage('immersive:' + on); } catch (e) { } }
            };
            document.addEventListener('DOMContentLoaded', function () {
                report();
                new MutationObserver(report).observe(document.body, { attributes: true, attributeFilter: ['class'] });
            });
        })();
    </script>
    <!-- autostart="false": MAUI's Mac handler starts Blazor itself (a WebKit user script calling Blazor.start()),
         so an autostart here started it twice — "Blazor has already started" on every launch. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
