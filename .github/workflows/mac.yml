name: Mac

# Builds the Mac Catalyst host (universal: Apple Silicon + Intel), runs the test suite on macOS,
# launches the app once as a smoke test (records startup timings), and uploads the unsigned
# (ad-hoc signed) .app as a zip for manual testing. No Apple Developer account is used.

# Manual only (D-90: macOS minutes cost 10× Linux; Mac runs only when the coordinator confirms).
on:
  workflow_dispatch:

jobs:
  mac:
    name: build, test, smoke, package
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          # SDK band 10.0.4xx, matching the pinned workload set below.
          dotnet-version: '10.0.4xx'

      # Newest installed Xcode that has a macOS SDK and actool (some images carry Xcode
      # versions without the macOS platform). Must be 26.5 or later for the pinned workload.
      # The pinned Mac Catalyst pack (26.5.10318) requires Xcode 26.6. The image carries two 26.6
      # installs; Xcode_26.6.0.app fails the build's SDK lookup, so the exact app is named here.
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.6.app
        run: |
          ls -d /Applications/Xcode*.app
          XC="$XCODE_APP"
          [ -d "$XC" ] || { echo "$XC not on this runner image"; exit 1; }
          sudo xcode-select -s "$XC"
          sudo xcodebuild -runFirstLaunch
          ls -la "$XC/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcodebuild -sdk "$(xcrun --sdk macosx --show-sdk-path)" -find actool
          sw_vers

      # Pinned workload set: 10.0.401 carries .NET for Mac Catalyst 26.5, which builds with Xcode
      # 26.5 or later. Newer sets (27.x) need Xcode 27.1, not yet on the runner image.
      # Move the pin forward when the runner gets Xcode 27.1 (docs/mac/README.md).
      - name: Install MAUI Mac Catalyst workload (pinned)
        run: |
          dotnet --version
          dotnet workload install maui-maccatalyst --version 10.0.401
          dotnet workload list

      - name: Restore
        run: |
          dotnet restore tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj --configfile ci/nuget.config
          dotnet restore tests/ChuvadiReader.Mac.Tests/ChuvadiReader.Mac.Tests.csproj --configfile ci/nuget.config
          dotnet restore src/ChuvadiReader.Mac/ChuvadiReader.Mac.csproj --configfile ci/nuget.config

      - name: Test (Core, on macOS)
        run: |
          dotnet test tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/ChuvadiReader.Mac.Tests/ChuvadiReader.Mac.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=mac-test-results.trx"

      - name: Build universal app
        run: dotnet build src/ChuvadiReader.Mac/ChuvadiReader.Mac.csproj -c Release --no-restore

      - name: Locate the app bundle
        run: |
          find src/ChuvadiReader.Mac/bin/Release -maxdepth 3 -name '*.app' -type d
          # Per-architecture bundles sit one folder deeper; the universal bundle is the shallowest.
          APP=$(find src/ChuvadiReader.Mac/bin/Release -maxdepth 3 -name '*.app' -type d | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BIN=$APP/Contents/MacOS/$EXE" >> "$GITHUB_ENV"
          echo "app: $APP  executable: $EXE"
          du -sh "$APP"
          # Size breakdown: biggest items in the bundle.
          du -ak "$APP/Contents" | sort -n | tail -25 | awk '{printf "%8.1f MB  %s\n", $1/1024, $2}'

      # Bundle layout (D-82, D-84): legal texts and the copyright line, exactly as the repo / packs carry them.
      - name: Verify bundle layout
        run: |
          set -e
          R="$APP/Contents/Resources/legal"
          ls -la "$R"
          for f in LICENSE.txt EULA.txt THIRD-PARTY-NOTICES.txt DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt DOTNET-MACCATALYST-LICENSE.txt; do
            [ -s "$R/$f" ] || { echo "missing: legal/$f"; exit 1; }
          done
          # M-12: every legal file is 0644 (no executable bit).
          for f in "$R"/*.txt; do m=$(stat -f %Lp "$f"); [ "$m" = "644" ] || { echo "mode $m: $f"; exit 1; }; done
          # M-05: the app icon is compiled into the bundle and named in Info.plist.
          [ -s "$APP/Contents/Resources/Assets.car" ] || { echo "no Assets.car (app icon)"; exit 1; }
          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist") || { echo "no CFBundleIconName"; exit 1; }
          echo "CFBundleIconName: $ICON"; ls -la "$APP/Contents/Resources" | grep -iE 'Assets.car|\.icns' || true
          cmp LICENSE "$R/LICENSE.txt"
          cmp legal/EULA.txt "$R/EULA.txt"
          cmp legal/THIRD-PARTY-NOTICES.txt "$R/THIRD-PARTY-NOTICES.txt"
          head -1 "$R/LICENSE.txt" | grep -q '^DRAFT' || { echo "LICENSE lost its DRAFT line"; exit 1; }
          head -1 "$R/EULA.txt" | grep -q '^DRAFT' || { echo "EULA lost its DRAFT line"; exit 1; }
          grep -q '^.NET Runtime uses third-party libraries' "$R/DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt"
          head -1 "$R/DOTNET-MACCATALYST-LICENSE.txt"
          C=$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' "$APP/Contents/Info.plist")
          echo "NSHumanReadableCopyright: $C"
          [ "$C" = "Copyright © 2026 Sthraas Intelligence Pvt Ltd. All rights reserved." ]
          {
            echo "### Bundle layout"
            echo '```'
            (cd "$APP/Contents/Resources" && ls -l legal | tail -n +2)
            echo "NSHumanReadableCopyright: $C"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Local-network text names printers only (M-22, D-148)
        run: |
          T=$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Contents/Info.plist")
          echo "NSLocalNetworkUsageDescription: $T"
          [[ "$T" == *printer* ]] || { echo "::error::NSLocalNetworkUsageDescription missing or not about printers"; exit 1; }

      - name: Prove the bundle is trimmed (AT-03)
        # The smoke runs below launch this bundle; this shows it is the trimmed Release, with ChuvadiReader.Platform
        # trimmed (no root-assembly workaround), so a constructor lost to trimming would fail them.
        run: |
          OBJ=src/ChuvadiReader.Mac/obj/Release/net10.0-maccatalyst
          found=0
          for linked in $(find "$OBJ" -path '*linked*' -name ChuvadiReader.Platform.dll); do
            found=1
            input=$(find src/ChuvadiReader.Platform/bin/Release -name ChuvadiReader.Platform.dll | head -1)
            a=$(stat -f %z "$input"); b=$(stat -f %z "$linked")
            echo "Platform: $a bytes in, $b bytes after ILLink ($linked)"
            [ "$b" -lt "$a" ] || { echo "::error::ChuvadiReader.Platform was not trimmed"; exit 1; }
          done
          [ "$found" = 1 ] || { echo "::error::no ILLink output found: the Release bundle was not trimmed"; find "$OBJ" -maxdepth 3 -type d | head -30; exit 1; }
          grep -q TrimmerRootAssembly src/ChuvadiReader.Mac/ChuvadiReader.Mac.csproj && { echo "::error::a root-assembly workaround is back"; exit 1; } || true

      - name: Verify both architectures
        if: ${{ !cancelled() }}
        run: |
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "not universal"; exit 1; }

      - name: Ad-hoc sign (no developer account; arm64 code must carry a signature to run)
        if: ${{ !cancelled() }}
        run: |
          codesign --force --deep --sign - --entitlements src/ChuvadiReader.Mac/Platforms/MacCatalyst/Entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke run (launch to first render, record startup)
        if: ${{ !cancelled() }}
        run: |
          set +e
          # Launched through LaunchServices (open), as a person double-clicking it would: a Mac
          # Catalyst app started by running its binary directly gets no scene and aborts.
          # -W waits for it to quit; macOS has no GNU timeout, so perl's alarm gives a 120 s limit.
          perl -e 'alarm shift; exec @ARGV' 120 open -W -n --env CHUVADI_SMOKE_EXIT=1 \
            --stdout "$PWD/smoke.log" --stderr "$PWD/smoke.log" "$APP"
          CODE=$?
          set -e
          cat smoke.log
          grep -q CHUVADI_SMOKE_OK smoke.log || { echo "smoke run did not reach first render (exit $CODE)"; exit 1; }
          {
            echo "### Startup on $(sysctl -n machdep.cpu.brand_string)"
            echo '```'
            grep CHUVADI_STARTUP smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mac Test M-01 … M-07, M-11: files at launch and while running, menu bar, Settings, geometry,
      # clean quit, startup breakdown — one real launch, every check reported (.github/scripts/mac-smoke.sh).
      - name: Smoke run (files, menu bar, window, quit)
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/mac-smoke.sh "$APP" 2>&1 | tee smoke-checks.txt
          RC=${PIPESTATUS[0]}
          {
            echo "### Mac smoke checks"
            echo '```'
            grep -E '^(PASS|FAIL)|^== ' smoke-checks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent "$APP" out/Chuvadi-mac-universal-unsigned.zip
          shasum -a 256 out/Chuvadi-mac-universal-unsigned.zip | tee out/SHA256.txt

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Chuvadi-mac-universal-unsigned
          path: out/

      - name: Upload test results and smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: |
            **/test-results.trx
            smoke.log
            smoke-files.log
            smoke-open-panel.log
            smoke-steps.log
            smoke-appearance.log
            *.ips
            chuvadi-logs-steps/
            chuvadi-logs/
            smoke-checks.txt
          if-no-files-found: ignore
