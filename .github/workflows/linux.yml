name: Linux

on:
  push:
    branches: [platform/linux]
    paths:
      - "src/**"
      - "tests/**"
      - "ci/**"
      - "tools/linux/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "src/ChuvadiReader.Linux/**"
      - "tools/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK and GTK 4 / WebKitGTK 6.0 (Ubuntu packages)
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq dotnet-sdk-10.0 libgtk-4-dev libwebkitgtk-6.0-dev \
            xvfb mutter imagemagick dbus-x11
          dotnet --info | head -8

      # Packages: the committed ci/packages feed (byte-identical to the Windows app), coordinator D-01,
      # copied to ./localpackages, which the repo's nuget.config points to.
      - name: Package feed
        run: bash scripts/setup-feed.sh

      - name: Build (warnings are errors)
        run: dotnet build src/ChuvadiReader.Linux -c Release -warnaserror

      - name: Run the Reader's and the host kit's tests
        run: |
          dotnet test tests/ChuvadiReader.Tests -c Release
          dotnet test tests/ChuvadiReader.Hosting.Tests -c Release

      - name: Publish (ReadyToRun)
        run: dotnet publish src/ChuvadiReader.Linux -c Release -r linux-${{ matrix.arch }} --self-contained false -o publish

      - name: Load the AppArmor profile the .deb ships (WebKit sandbox needs userns on Ubuntu 24.04+)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sed "s#@CHUVADI_BINARY@#$PWD/publish/chuvadi-reader#" \
            src/ChuvadiReader.Linux/packaging/apparmor/chuvadi-reader | sudo tee /etc/apparmor.d/chuvadi-reader-ci >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/chuvadi-reader-ci

      - name: Launch test under Xvfb
        run: bash tools/linux/smoke.sh "$PWD/publish" "$PWD/smoke" 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}
          path: |
            publish
            smoke
