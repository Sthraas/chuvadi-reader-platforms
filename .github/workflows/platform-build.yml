# Reusable job template for the platform programme. Platform chats call it from their own
# workflow (or add a job to platforms.yml) instead of copying steps.
#
#   jobs:
#     linux:
#       uses: ./.github/workflows/platform-build.yml
#       with:
#         runner: ubuntu-latest
#         build: src/ChuvadiReader.Linux/ChuvadiReader.Linux.csproj
#
# Zero-warnings policy: every build runs with -warnaserror.
# Packages: always the committed ci/packages feed (coordinator decision, 6 Nov 2026).
name: platform-build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner label (ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest).
        required: true
        type: string
      build:
        description: Solution or project to build.
        required: true
        type: string
      test:
        description: Solution or test project to run after the build (empty = no tests).
        required: false
        type: string
        default: ''
      build-args:
        description: Extra arguments for dotnet build (e.g. -p:EnableWindowsTargeting=true, -f net10.0-android).
        required: false
        type: string
        default: ''
      workloads:
        description: .NET workloads to install first (e.g. "maui-android"). Empty = none.
        required: false
        type: string
        default: ''
      label:
        description: Short unique name for this job's artifacts (e.g. shared, windows-app, linux).
        required: true
        type: string
      pack-check:
        description: true = also re-pack chuvadi-pdf from the unchanged v3.31.2 tag and check it yields the same package set as ci/packages (a check only; builds always restore from ci/packages).
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.runner }} · ${{ inputs.build }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        if: inputs.workloads != ''
        run: dotnet workload install ${{ inputs.workloads }}

      - name: Pack check (chuvadi-pdf tag vs ci/packages)
        if: inputs.pack-check
        shell: bash
        run: scripts/setup-feed.sh --verify-pack

      # Packages always come from the committed ci/packages feed (byte-identical to the Windows app).
      - name: Restore
        shell: bash
        run: dotnet restore "${{ inputs.build }}" --configfile ci/nuget.config ${{ inputs.build-args }}

      - name: Build (warnings are errors)
        shell: bash
        run: dotnet build "${{ inputs.build }}" -c Release --no-restore -warnaserror ${{ inputs.build-args }}

      - name: Test
        if: inputs.test != ''
        shell: bash
        run: dotnet test "${{ inputs.test }}" -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always() && inputs.test != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.label }}-${{ inputs.runner }}
          path: '**/test-results.trx'
          if-no-files-found: ignore
