name: Mac startup

# D-50: compare the startup options the .NET for Mac Catalyst SDK offers. ReadyToRun is a CoreCLR format and
# does not apply — Mac Catalyst runs on Mono — so the levers are how managed code is compiled.
# Fair comparison: all variants are built and launched on the SAME runner, in interleaved rounds
# (A B C, A B C, …), so machine-to-machine differences between hosted runners cancel out.

# Manual only (D-90).
on:
  workflow_dispatch:

jobs:
  startup:
    name: compare on one runner
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ROUNDS: '12'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          sudo xcodebuild -runFirstLaunch

      - name: Install MAUI Mac Catalyst workload (pinned)
        run: dotnet workload install maui-maccatalyst --version 10.0.401

      - name: Build the variants
        run: |
          set -e
          mkdir -p variants
          build() { # name, extra msbuild properties
            rm -rf src/ChuvadiReader.Mac/bin src/ChuvadiReader.Mac/obj
            dotnet restore src/ChuvadiReader.Mac/ChuvadiReader.Mac.csproj --configfile ci/nuget.config
            dotnet build src/ChuvadiReader.Mac/ChuvadiReader.Mac.csproj -c Release --no-restore $2
            APP=$(find src/ChuvadiReader.Mac/bin/Release -maxdepth 3 -name '*.app' -type d | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
            ditto "$APP" "variants/$1.app"
            codesign --force --deep --sign - --entitlements src/ChuvadiReader.Mac/Platforms/MacCatalyst/Entitlements.plist "variants/$1.app"
            echo "SIZE $1 $(du -sm "variants/$1.app" | cut -f1) MB"
          }
          build aot ""
          build interpreter "-p:UseInterpreter=true"
          build llvm "-p:MtouchUseLlvm=true"

      - name: Launch in interleaved rounds
        run: |
          set -e
          ms() { grep "CHUVADI_STARTUP $1 " run.log | sed -E 's/.* ([0-9]+)ms$/\1/'; }
          echo "variant,round,main,window,webview,first" > startup.csv
          for r in $(seq 1 "$ROUNDS"); do
            for v in aot interpreter llvm; do
              rm -f run.log
              perl -e 'alarm shift; exec @ARGV' 120 open -W -n --env CHUVADI_SMOKE_EXIT=1 \
                --stdout "$PWD/run.log" --stderr "$PWD/run.log" "variants/$v.app" || true
              grep -q CHUVADI_SMOKE_OK run.log || { cat run.log; echo "$v round $r failed"; exit 1; }
              echo "$v,$r,$(ms main),$(ms window),$(ms webview-ready),$(ms first-render)" | tee -a startup.csv
            done
          done

      - name: Summarise
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, statistics as st
          rows = list(csv.DictReader(open("startup.csv")))
          print("| variant | round 1 first render | median first render (rounds 2+) | min | max | median WebView ready |")
          print("|---|---|---|---|---|---|")
          for v in ["aot", "interpreter", "llvm"]:
              r = [x for x in rows if x["variant"] == v]
              warm = [int(x["first"]) for x in r[1:]]
              web = [int(x["webview"]) for x in r[1:]]
              print(f"| {v} | {r[0]['first']} | {st.median(warm):.0f} | {min(warm)} | {max(warm)} | {st.median(web):.0f} |")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: mac-startup
          path: startup.csv
