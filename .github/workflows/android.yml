name: Android

# Builds the Android test composition (docs/android/integration/compose.sh): a pinned snapshot of
# platform/foundation + a pinned platform/mobile-ui merged in + Android's pending proposals + this
# branch's Android host.
# Produces the Play Store .aab plus an .apk, then on Android emulators — phone and tablet, API 35
# (the minimum) and API 36 (the latest) — runs the smoke test and real touch-gesture checks.
#
# Tooling here (setup actions, the emulator runner) is test/CI tooling only; nothing from it
# ships in the app (programme rule 3).

# Manual dispatch only (coordinator, 7 Nov: emulator minutes are the largest part of the bill; one run
# per round, started by hand). Pushes and pull requests start nothing.
on:
  workflow_dispatch:
    inputs:
      emulators:
        description: "Emulators to run: all, none (build only), or a comma list of phone-35, phone-36, tablet-35, tablet-36"
        required: true
        default: all
      suite:
        description: "full (smoke, then gestures + platform, or the WebView gate), smoke (install, start, Ui, rotation, no crash), or timeline (AT-14: cold Open with, stage by stage, as shipped and with Chuvadi-only full AOT)"
        required: true
        default: full
        type: choice
        options: [full, smoke, timeline]

env:
  # platform/foundation-pr: patch 25 parts 1-4 (AT-17, AT-16, D-164 cold open, H-22, Docs 2.1.0) on Reader main 4b724b0.
  FOUNDATION_REF: 742a5daef7084f4e41052bcfbfa0e714c93f38eb
  # platform/mobile-ui: patch 24 merged, H-23 Excel value bar proposal (in mobile-ui-hooks-9, Foundation's to take).
  MOBILEUI_REF: 5c66f1a4ae5f2c36e06e9830f89c18d72b569e91
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: build (.aab + .apk)
    runs-on: ubuntu-latest
    outputs:
      emulators: ${{ steps.plan.outputs.emulators }}
    steps:
      - name: Plan the emulators asked for
        id: plan
        env:
          WANT: ${{ inputs.emulators }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          profiles = {"phone": "pixel_7", "tablet": "pixel_tablet"}
          every = [f"{d}-{a}" for d in ("phone", "tablet") for a in (35, 36)]
          want = os.environ.get("WANT", "all").replace(" ", "").lower()
          names = every if want == "all" else [] if want in ("", "none") else want.split(",")
          bad = [n for n in names if n not in every]
          if bad:
              raise SystemExit(f"unknown emulator(s): {bad}; use {every}, all or none")
          plan = [{"device": n.split("-")[0], "api": int(n.split("-")[1]), "profile": profiles[n.split("-")[0]]} for n in names]
          print("emulators=" + json.dumps(plan))
          PY

      - uses: actions/checkout@v4
        with:
          path: platforms

      - name: Check out the Foundation snapshot (pinned, read-only; full history for the merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FOUNDATION_REF }}
          path: reader
          fetch-depth: 0

      - name: Compose Foundation + Mobile UI (merged) + Android proposals + Android host
        run: bash platforms/docs/android/integration/compose.sh reader ${{ env.MOBILEUI_REF }} platforms

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned (AT-19): what is tested is what ships; move it deliberately. Same as Android Test's workflow.
          dotnet-version: '10.0.403'

      # setup-dotnet only adds 10.0.403 beside the runner's own newer SDK, and dotnet picks the newest unless a
      # global.json says otherwise (run 42903642195 still resolved runtime 10.0.15). The composed checkout gets one
      # (CI only; a global.json in the repo is Foundation's to add).
      - name: Hold the build to SDK 10.0.403
        working-directory: reader
        run: |
          echo '{ "sdk": { "version": "10.0.403", "rollForward": "disable" } }' > global.json
          dotnet --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the MAUI Android workload
        working-directory: reader   # under the pinned SDK, so the workload matches the SDK that builds
        run: dotnet workload install maui-android

      # The Reader's root nuget.config points at the dev-only ./localpackages; CI restores from
      # its committed feed (ci/packages) + nuget.org, exactly like the Reader's own CI.
      - name: Restore (Reader's own CI feed + nuget.org for Microsoft's MAUI packages)
        working-directory: reader
        run: dotnet restore src/ChuvadiReader.Android/ChuvadiReader.Android.csproj --configfile ci/nuget.config

      - name: Install Android SDK packages the build needs
        working-directory: reader
        run: >
          dotnet build -t:InstallAndroidDependencies -f net10.0-android --no-restore
          src/ChuvadiReader.Android/ChuvadiReader.Android.csproj
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=True

      # Release: Play upload bundle (.aab) and .apk, signed only with the throwaway debug key.
      - name: Publish Release (.aab + .apk)
        working-directory: reader
        run: >
          dotnet publish src/ChuvadiReader.Android/ChuvadiReader.Android.csproj
          -c Release -f net10.0-android --no-restore
          -p:AndroidSdkDirectory=$ANDROID_HOME

      # AT-02: the shipped manifest declares only what the app uses, and asks for no permissions.
      - name: Check the Release manifest
        run: bash platforms/docs/android/ci/manifest-check.sh "$(find reader/src/ChuvadiReader.Android/bin/Release -name '*-Signed.apk' | head -1)"

      # Debug x86_64 .apk for the emulators.
      - name: Build Debug .apk for emulators (x86_64)
        working-directory: reader
        run: >
          dotnet build src/ChuvadiReader.Android/ChuvadiReader.Android.csproj
          -c Debug -f net10.0-android -p:RuntimeIdentifier=android-x64 -p:EmbedAssembliesIntoApk=true
          -p:RestoreConfigFile=ci/nuget.config -p:AndroidSdkDirectory=$ANDROID_HOME

      - name: Collect packages
        run: |
          mkdir -p out
          find reader/src/ChuvadiReader.Android/bin/Release -name '*-Signed.apk' -exec cp {} out/chuvadi-reader-release.apk \;
          find reader/src/ChuvadiReader.Android/bin/Release -name '*-Signed.aab' -exec cp {} out/chuvadi-reader-release.aab \;
          find reader/src/ChuvadiReader.Android/bin/Debug -name '*-Signed.apk' -exec cp {} out/chuvadi-reader-debug-x64.apk \;
          ls -la out

      # AT-14 test variant (never shipped): the same Release with Chuvadi's own assemblies fully AOT-compiled
      # (ChuvadiAot.targets), built only for the timeline suite, after the shipped packages are collected.
      - name: Publish Release variant, Chuvadi-only full AOT (timeline only)
        if: inputs.suite == 'timeline'
        working-directory: reader
        run: |
          rm -rf src/ChuvadiReader.Android/obj/Release src/ChuvadiReader.Android/bin/Release
          start=$(date +%s)
          # Restores again: the Debug x86_64 build above restored for android-x64 only.
          dotnet publish src/ChuvadiReader.Android/ChuvadiReader.Android.csproj -c Release -f net10.0-android \
            -p:RestoreConfigFile=ci/nuget.config -p:AndroidSdkDirectory=$ANDROID_HOME -p:ChuvadiFullAot=true
          echo "variant build: $(( $(date +%s) - start )) s"
          find src/ChuvadiReader.Android/bin/Release -name '*-Signed.apk' -exec cp {} ../out/chuvadi-reader-release-chuvadi-aot.apk \;
          find src/ChuvadiReader.Android/bin/Release -name '*-Signed.aab' -exec cp {} ../out/chuvadi-reader-release-chuvadi-aot.aab \;
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: out/
          if-no-files-found: error

  emulator:
    name: emulator (${{ matrix.device }}, API ${{ matrix.api }})
    needs: build
    # Only the emulators asked for in the dispatch.
    if: needs.build.outputs.emulators != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.emulators) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: out

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test tooling (DevTools client for checking gesture results; never shipped)
        run: pip install websocket-client==1.8.0

      - name: Smoke test and touch gestures on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # No hardware keyboard, like a phone or tablet in the hand: the on-screen keyboard then shows
          # in full (key events injected with `adb shell input` still reach the app).
          pre-emulator-launch-script: |
            sed -i '/^hw.keyboard=/d' ~/.android/avd/test.avd/config.ini 2>/dev/null || true
            echo 'hw.keyboard=no' >> ~/.android/avd/test.avd/config.ini
            grep hw.keyboard ~/.android/avd/test.avd/config.ini
          # Debug for the checks (WebView DevTools), then the Release .apk people get: install, start, no crash.
          script: SUITE=${{ inputs.suite }} bash docs/android/ci/emulator-tests.sh out/chuvadi-reader-debug-x64.apk results/${{ matrix.device }}-api${{ matrix.api }} out/chuvadi-reader-release.apk out/chuvadi-reader-release-chuvadi-aot.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.device }}-api${{ matrix.api }}
          path: results/
          if-no-files-found: ignore
