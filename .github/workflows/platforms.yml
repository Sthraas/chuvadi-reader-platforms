# DIAGNOSTIC BRANCH ONLY (never merged): the full test project looped on the Windows runner with the settle fix.
name: platforms
on:
  push:
    branches: ['platform/diag-*']
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: bash
        run: dotnet restore ChuvadiReader.slnx --configfile ci/nuget.config
      - name: Build
        shell: bash
        run: dotnet build ChuvadiReader.slnx -c Release --no-restore
      - name: Loop
        shell: bash
        run: |
          for i in $(seq 1 16); do
            dotnet test tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-build > out.txt 2>&1 || true
            grep -E "Passed!|Failed!|live memory|memory kept|^  Failed " out.txt | cut -c1-160
          done
