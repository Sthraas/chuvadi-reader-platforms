# DIAGNOSTIC BRANCH ONLY (never merged): the Windows memory test, looped, with what is still holding the page.
name: platforms
on:
  push:
    branches: ['platform/diag-*']
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: bash
        run: dotnet restore ChuvadiReader.slnx --configfile ci/nuget.config
      - name: Build
        shell: bash
        run: dotnet build ChuvadiReader.slnx -c Release --no-restore
      - name: Loop
        shell: bash
        run: |
          export CHVD_DIAG="$GITHUB_WORKSPACE/diag.txt"
          echo "---- whole class, as CI runs it (6 times)"
          for i in $(seq 1 10); do
            dotnet test tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-build > out.txt 2>&1 || true
            grep -E "Passed!|Failed!|live memory|memory kept" out.txt | cut -c1-120; echo "RUN $i end" >> "$CHVD_DIAG"
          done
          echo "---- diag"; cat "$CHVD_DIAG"
