name: Web

on:
  push:
    branches: [platform/web]
  pull_request:
    branches: [platform/web]
  workflow_dispatch:

# A newer push cancels the older run (as platforms.yml, D-90 d).
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: web portal build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same committed feed the Reader's CI uses (ci/packages), so the web build gets the exact
      # Chuvadi packages the Windows app ships.
      - name: Restore
        run: |
          dotnet restore src/ChuvadiReader.Web/ChuvadiReader.Web.csproj --configfile ci/nuget.config
          dotnet restore tests/ChuvadiReader.Web.Tests/ChuvadiReader.Web.Tests.csproj --configfile ci/nuget.config
          dotnet restore tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj --configfile ci/nuget.config

      - name: Build (warnings are errors)
        run: |
          dotnet build src/ChuvadiReader.Web/ChuvadiReader.Web.csproj -c Release --no-restore -warnaserror
          dotnet build tests/ChuvadiReader.Web.Tests/ChuvadiReader.Web.Tests.csproj -c Release --no-restore -warnaserror
          dotnet build tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-restore -warnaserror

      - name: Test
        run: |
          dotnet test tests/ChuvadiReader.Web.Tests/ChuvadiReader.Web.Tests.csproj -c Release --no-build --logger "trx;LogFileName=web-tests.trx"
          dotnet test tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-build --logger "trx;LogFileName=reader-tests.trx"

      - name: Publish
        run: dotnet publish src/ChuvadiReader.Web/ChuvadiReader.Web.csproj -c Release --no-restore -warnaserror -o out/web

      # WT-11: the package holds only what runs on the Linux server.
      - name: Check the package
        run: bash tests/web-e2e/check-package.sh out/web

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: '**/*-tests.trx'
          if-no-files-found: ignore
